name: Gerar APK

on:
  push:
    branches: [tradutor-legenda]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TradutorLegenda.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Tradutor de Legenda v${{ github.run_number }}
          body: Baixe o arquivo TradutorLegenda.apk abaixo e instale no celular.
          files: TradutorLegenda.apk
